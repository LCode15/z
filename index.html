
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Christmas List</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    background: #f5f1e8;
    color: #253b2e;
    min-height: 100vh;
    padding: 40px 20px;
}

.container {
    max-width: 750px;
    margin: auto;
    background: #fffdf7;
    padding: 45px;
    border: 1px solid #ded8c9;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

header {
    text-align: center;
    margin-bottom: 35px;
}

header .subtitle {
    color: #a13b35;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

h1 {
    font-size: 48px;
    color: #a13b35;
    font-weight: normal;
}

header p {
    color: #777;
    margin-top: 12px;
    font-size: 15px;
}

.divider {
    border: none;
    border-top: 1px solid #ded8c9;
    margin: 30px 0;
}

.list-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

h2 {
    font-size: 21px;
    font-weight: normal;
}

.year {
    color: #a13b35;
    font-size: 13px;
    letter-spacing: 2px;
}

.item {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 65px;
    border-bottom: 1px solid #e9e5dc;
}

.number {
    color: #a13b35;
    font-size: 14px;
    width: 20px;
}

.item-space {
    flex: 1;
    height: 35px;
}

footer {
    text-align: center;
    margin-top: 40px;
    color: #a13b35;
    font-size: 13px;
    letter-spacing: 2px;
}

@media (max-width: 550px) {
    .container {
        padding: 25px 20px;
    }

    h1 {
        font-size: 36px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <div class="subtitle">Logan 2026</div>
        <h1>Christmas List</h1>
    </header>

    <hr class="divider">

    <div class="list-heading">
        <h2>My List</h2>
        <span class="year">CHRISTMAS 2026</span>
    </div>

    <main>
        <div class="item"><span class="number">01</span>Flamin Hot Cheetos<div class="item-space"></div></div>
        <div class="item"><span class="number">02</span>Flamin Hot Doritos (red)<div class="item-space"></div></div>
        <div class="item"><span class="number">03</span>Flamin Hot Doritos (blue)<div class="item-space"></div></div>
        <div class="item"><span class="number">04</span>Flamin Hot Puffs<div class="item-space"></div></div>
        <div class="item"><span class="number">05</span>Flamin Hot Funyuns<div class="item-space"></div></div>
        <div class="item"><span class="number">06</span>Flamin Hot Fritos<div class="item-space"></div></div>
        <div class="item"><span class="number">07</span>Flamin Hot Popcorn<div class="item-space"></div></div>
        <div class="item"><span class="number">08</span>Flamin Hot Ruffles<div class="item-space"></div></div>
        <div class="item"><span class="number">09</span>Flamin Hot Fritos<div class="item-space"></div></div>
        <div class="item"><span class="number">10</span>Takis<div class="item-space"></div></div>
    </main>

    <footer>
        ✦ CHRISTMAS ✦
    </footer>

</div>

</body>
</html>
